name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/develop-V1.0.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codequality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next-env.d.ts is gitignored; generate it so SVG/image imports typecheck.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Lint, typecheck, format, cspell, knip
        run: pnpm codequality
